services:
  bridge:
    # Pulls the published image; `docker compose build` (or ./restart.sh) builds it from this checkout
    # instead. Pin a release with AYS_TAG=0.1.0, or follow main with AYS_TAG=edge.
    image: ghcr.io/o-mutt/audioyotoshelf:${AYS_TAG:-latest}
    build: .
    container_name: audioyotoshelf
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-8080}:8080"
    # Flat variables read by the app itself (see "Environment variables" in the README). Postgres and
    # Redis are found at their service names below, so DB_PASSWORD is the only database setting needed.
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - YOTO_CLIENT_ID=${YOTO_CLIENT_ID}
      - YOTO_CLIENT_SECRET=${YOTO_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUDIOBOOKSHELF_URL=${AUDIOBOOKSHELF_URL:-}
      - AUDIOBOOKSHELF_PUBLIC_URL=${AUDIOBOOKSHELF_PUBLIC_URL:-}
      - ADMIN_AUDIOBOOKSHELF_URL=${ADMIN_AUDIOBOOKSHELF_URL:-}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=${ASPNETCORE_FORWARDEDHEADERS_ENABLED:-false}
      - HANGFIRE_DASHBOARD_ENABLED=${HANGFIRE_DASHBOARD_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-Information}
      - SEQ_URL=${SEQ_URL:-}
    volumes:
      - tempdata:/app/temp
      # Session-cookie keys: without this, recreating the container signs everyone out.
      - keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bridge-net

  postgres:
    image: postgres:17-alpine
    container_name: audioyotoshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: audioyotoshelf
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d audioyotoshelf"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bridge-net

  redis:
    image: redis:7-alpine
    container_name: audioyotoshelf-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bridge-net

volumes:
  pgdata:
  redisdata:
  tempdata:
  keys:

networks:
  bridge-net:
    driver: bridge
