version: 2
updates:
  # Backend NuGet packages (central versions live in Directory.Packages.props)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Frontend npm packages
  - package-ecosystem: npm
    directory: "/src/AudioYotoShelf.ClientApp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
