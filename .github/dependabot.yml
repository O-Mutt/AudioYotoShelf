version: 2
updates:
  # Backend NuGet packages (central versions live in Directory.Packages.props)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns:
          - "*"
    ignore:
      # ImageSharp 4+ requires a paid Six Labors license key to build.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
      # FluentAssertions 8+ requires a paid commercial license.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Frontend npm packages
  - package-ecosystem: npm
    directory: "/src/AudioYotoShelf.ClientApp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 ships no JS API, so typescript-eslint and vue-tsc (Volar) cannot load it.
      # Drop this once both support TypeScript 7.1+ (tracked in #125).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Base images in the Dockerfile (node, dotnet/sdk, dotnet/aspnet)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
