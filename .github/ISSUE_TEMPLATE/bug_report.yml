name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I transfer a large book, the upload fails with...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce it.
      placeholder: |
        1. Connect to Audiobookshelf
        2. Start a transfer for "..."
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste container logs (`docker compose logs bridge`). Redact any tokens or secrets.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit SHA or release tag you are running.
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Proxmox LXC
        - Local dev (dotnet run / npm run dev)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I removed any secrets/tokens from logs above
          required: true
