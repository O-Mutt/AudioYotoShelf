name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AudioYotoShelf.sln

      - name: Format check
        run: dotnet format AudioYotoShelf.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build AudioYotoShelf.sln -c Release --no-restore

      - name: Test + coverage
        run: >
          dotnet test AudioYotoShelf.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Publish test results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: ".NET Test Results"
          comment_mode: always

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AudioYotoShelf.ClientApp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/AudioYotoShelf.ClientApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test + coverage
        run: npm run test:coverage

      - name: Publish test results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: src/AudioYotoShelf.ClientApp/test-results/junit.xml
          check_name: "Frontend Test Results"
          comment_mode: always

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: src/AudioYotoShelf.ClientApp/coverage/cobertura-coverage.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Frontend coverage path mapping can need tuning; don't fail the build on upload issues.
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  integration:
    name: Integration (.NET + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Testcontainers spins real Postgres + Redis via the runner's Docker daemon, so the app's
      # startup migrations and the cookie/auth/admin pipeline run for real (the in-memory unit
      # tests can't cover these).
      - name: Integration tests
        run: >
          dotnet test tests/AudioYotoShelf.IntegrationTests/AudioYotoShelf.IntegrationTests.csproj
          -c Release
          --results-directory ./TestResults
          --logger "trx;LogFileName=integration.trx"

      - name: Publish test results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: "Integration Test Results"
          comment_mode: always
