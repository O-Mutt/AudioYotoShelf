name: Docker

# Builds the container image. Pull requests build and smoke-test it without pushing; main publishes
# `edge`, release tags (vX.Y.Z) publish `X.Y.Z`, `X.Y`, `X` and `latest`. Images go to GHCR, and to
# Docker Hub once the DOCKERHUB_REPOSITORY variable and DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets
# are set. See docs/specs/container-image-pipeline.md.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    # None of these are in the image's build context (see .dockerignore).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref, but never a release build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/o-mutt/audioyotoshelf

jobs:
  pr:
    name: Build + smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # amd64 only: the arm64 build is the same Dockerfile cross-compiled, and runs on every main push.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: audioyotoshelf:ci
          build-args: |
            VERSION=0.0.0-pr.${{ github.event.number }}
            GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: .github/scripts/smoke-test-image.sh audioyotoshelf:ci

  publish:
    name: Build + publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # sign the provenance attestation
      attestations: write   # actions/attest-build-provenance
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7

      # A release tag carries its own version; everything else is a dev build.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-edge" >> "$GITHUB_OUTPUT"
          fi

      # Only the runtime stage's apt-get runs emulated; the .NET and npm builds cross-compile.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_REPOSITORY != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.GHCR_IMAGE }}
            name=docker.io/${{ env.DOCKERHUB_REPOSITORY }},enable=${{ env.DOCKERHUB_REPOSITORY != '' }}
          # `latest` comes from the default flavor (latest=auto): set for release tags, not pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge
            type=sha

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (Docker Hub)
        if: env.DOCKERHUB_REPOSITORY != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  dockerhub-readme:
    name: Sync Docker Hub description
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          short-description: Bridge your Audiobookshelf library to Yoto MYO cards
          readme-filepath: docs/docker-hub.md
